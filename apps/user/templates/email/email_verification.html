<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .header {
      background: #4CAF50;
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .content {
      padding: 30px;
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }
    .code {
      display: inline-block;
      background: #f0f0f0;
      padding: 12px 20px;
      font-size: 22px;
      font-weight: bold;
      color: #4CAF50;
      border-radius: 6px;
      margin: 20px 0;
    }
    .button {
      display: inline-block;
      background: #4CAF50;
      color: #fff;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-size: 16px;
      margin-top: 20px;
    }
    .footer {
      background: #eee;
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Account Verification</div>
    <div class="content">
      <p>Hello {{ user.first_name }},</p>
      <p>Thank you for signing up! Please use the code below to verify your account:</p>
      <div class="code">{{ code }}</div>
      <p>This code will expire in 5 minutes.</p>
    </div>
    <div class="footer">
      &copy; 2026 BaadFaad Inc. All rights reserved.
    </div>
  </div>
</body>
</html>
